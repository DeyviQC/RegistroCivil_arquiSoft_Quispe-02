name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (${{ matrix.base }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # SQLite is fast; MySQL is the production engine (AC05: integrity must hold on both).
        base: [sqlite, mysql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: registro_civil_prueba
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, pdo_mysql, gd, zip, intl, fileinfo
          coverage: none

      - name: Configurar Python (preparación de PDFs para firma)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de Python
        run: pip install pypdf reportlab

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Instalar dependencias de Composer
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Ejecutar tests en SQLite
        if: matrix.base == 'sqlite'
        env:
          FIRMA_PYTHON: python
        run: php artisan test

      - name: Ejecutar tests en MySQL
        if: matrix.base == 'mysql'
        env:
          FIRMA_PYTHON: python
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: registro_civil_prueba
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  phpstan:
    name: Análisis estático (PHPStan nivel 5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Configurar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, gd, zip, intl, fileinfo
          coverage: none

      - name: Caché de Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}

      - name: Instalar dependencias de Composer
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Ejecutar PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
